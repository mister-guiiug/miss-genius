    <!--
      LES MARQUEURS `__ANALYTICS_*__` ONT ÉTÉ RETIRÉS.

      `pwaSeoPlugin` les remplaçait AU BUILD par le tag de Google dès
      qu'un identifiant était posé — précédé d'un `consent default` tout
      refusé, donc sans collecte, mais le script partait quand même au
      chargement de la page.

      `ConsentBanner`, monté depuis la campagne de mesure, fait le même
      travail autrement : il n'injecte RIEN avant l'accord. Garder les deux
      chemins ferait partir DEUX tags le jour où la variable serait posée.
      Le socle porte deux réponses à la même question ; cette app
      n'en garde qu'une.
    -->
    <!-- Anti-FOUC : applique le thème avant le premier rendu. -->
    <script>
      (function () {
        try {
          var k = 'miss-genius:theme';
          var v = localStorage.getItem(k);
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = eff;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Miss Genius — Simulateur de moyennes</title>
  </head>
  <body>

  </body>
