<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <!--
      Content-Security-Policy en défense en profondeur.
      'unsafe-inline' : script anti-FOUC + styles Tailwind/vite-plugin-pwa.
      Tiers autorisés : Google Fonts (styles/polices) et le proxy Pronote
      (Cloudflare Worker, connect-src *.workers.dev — cf. VITE_PRONOTE_PROXY_URL).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.workers.dev; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#6d28d9" />
    <meta
      name="description"
      content="Miss Genius — simule tes moyennes scolaires : matières, notes, scénarios et objectifs. 100% hors ligne."
    />
    <link rel="canonical" href="__SEO_HOME_URL__" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Miss Genius" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:url" content="__SEO_HOME_URL__" />
    <meta
      property="og:title"
      content="Miss Genius — simulateur de moyennes scolaires"
    />
    <meta
      property="og:description"
      content="Simule tes moyennes scolaires : matières, notes, scénarios et objectifs. 100 % hors ligne."
    />
    <meta property="og:image" content="__SEO_LOGO_URL__" />

    <meta name="twitter:card" content="summary" />
    <meta
      name="twitter:title"
      content="Miss Genius — simulateur de moyennes scolaires"
    />
    <meta
      name="twitter:description"
      content="Simulateur de moyennes scolaires, 100 % hors ligne et installable (PWA)."
    />
    <meta name="twitter:image" content="__SEO_LOGO_URL__" />

    <!-- Analytics (GTM/GA4) injecté par pwaSeoPlugin() — vide tant qu'aucun
         VITE_GTM_CONTAINER_ID / VITE_GA_MEASUREMENT_ID n'est configuré. -->
    __ANALYTICS_HEAD__
    <!-- Anti-FOUC : applique le thème avant le premier rendu. -->
    <script>
      (function () {
        try {
          var k = 'miss-genius:theme';
          var v = localStorage.getItem(k);
          var eff =
            v === 'light' || v === 'dark'
              ? v
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = eff;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Miss Genius — Simulateur de moyennes</title>
  </head>
  <body>
    __ANALYTICS_BODY__
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
