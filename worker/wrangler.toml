name = "miss-genius-pronote-proxy"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# L'origine de l'application, seule autorisée par CORS depuis le 20/11/2026,
# jour où l'app publiée a été branchée sur ce Worker. Pour un essai local
# (`npm run dev`), la surcharger dans `worker/.dev.vars` : ALLOWED_ORIGIN="*".
[vars]
ALLOWED_ORIGIN = "https://mister-guiiug.github.io"
