# Configuration CodeQL de miss-genius.
#
# UN SEUL FICHIER EXCLU, et pour une raison écrite. `worker/test/faux-pronote.ts`
# est un faux serveur Pronote, écrit pour éprouver le client du Worker sans
# compte réel. Il reproduit À DESSEIN la cryptographie du protocole Pronote :
# clés et vecteurs AES dérivés par MD5. CodeQL y voit donc « algorithme
# faible » (js/weak-cryptographic-algorithm) : vrai en général, voulu ici. Sa
# clé RSA, dont la taille n'est pas imposée par le protocole, fait 2048 bits et
# ne justifie plus l'exclusion. Ce fichier ne sert qu'aux tests et n'est jamais
# déployé. Tout le reste du dépôt, client Pronote compris
# (`worker/src/pronote/`), reste analysé.
name: miss-genius
paths-ignore:
  - worker/test/faux-pronote.ts
